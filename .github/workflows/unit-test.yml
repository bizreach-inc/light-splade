name: unit-test
on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    paths:
      - src/**
  push:
    paths:
      - src/**

defaults:
  run:
    working-directory: ./

jobs:
  unit-test:
    environment:
      name: dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Takumi Guard
        uses: flatt-security/setup-takumi-guard-pypi@v1
        with:
          bot-id: "BT01KJVWWCWV4T141Y8XDTX6CH1G"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "./.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest
